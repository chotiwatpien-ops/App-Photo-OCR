# Render Blueprint — free web service. Database lives on Neon (set DATABASE_URL in the dashboard).
services:
  - type: web
    name: rider-photo-ocr
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: RENDER
        value: "1"
      - key: DATABASE_URL        # Neon connection string (postgresql://...)
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD        # shared team password for the web UI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: MAX_PARALLEL
        value: "4"
      - key: DRIVE_INBOX_FOLDER_ID
        value: 18eIIwSjhAcaAlXOILAJGfaQZghnkzERa
      - key: DRIVE_EXPORTS_FOLDER_ID
        value: 1oQaYFS07ZzpbSO5qq9RtAmSf_WAFYOOv
      - key: GITHUB_REPO           # for the "run ingest now" button (needs GITHUB_TOKEN, added later)
        value: chotiwatpien-ops/App-Photo-OCR
      - key: GITHUB_WORKFLOW
        value: ingest.yml
