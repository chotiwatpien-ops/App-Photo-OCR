name: Weekly ingest (Drive → Gemini → DB → Excel)

on:
  schedule:
    # GitHub fires about one scheduled run in three, 20-95 minutes late (measured 2026-08-24..28:
    # 8 runs where ~25 were due). So it is asked every hour and the round itself decides whether
    # it is due — --min-gap makes an early one exit in seconds, long before any real work.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List only, don't process"
        type: boolean
        default: false
      limit:
        description: "Max images this run (blank = all)"
        type: string
        default: ""
      exports_only:
        description: "Regenerate Excel + customer images only (no Gemini cost)"
        type: boolean
        default: false
      exports_jobs:
        description: "สร้างรูปส่งลูกค้าใหม่เฉพาะ job id (คั่นด้วยจุลภาค) — ไม่เสียค่า AI"
        type: string
        default: ""
      model:
        description: "Override model THIS run only (blank = default 3.7-flash)"
        type: string
        default: ""
      delete_jobs:
        description: "ลบ job ตาม id (คั่นด้วยจุลภาค) เช่น 167,168"
        type: string
        default: ""
      delete_trips:
        description: "ลบแถวตาม id (คั่นด้วยจุลภาค) — ใช้กับแถวซ้ำที่ตรวจรูปยืนยันแล้ว"
        type: string
        default: ""
      dedupe_approved:
        description: "ลบแถวอนุมัติซ้ำ (booking code ซ้ำของไรเดอร์คนเดียวกัน)"
        type: boolean
        default: false
      live_read:
        description: "อ่านสดรอบนี้ (ไม่ใช้ batch) — ผลมาทันทีแต่จ่ายเต็มราคา"
        type: boolean
        default: false
      redo_model:
        description: "อ่านใหม่เฉพาะงานที่โมเดลนี้เคยอ่าน เช่น flash-lite (ตั้งช่อง model ข้างบนเป็นตัวที่จะใช้อ่านแทน)"
        type: string
        default: ""

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # a full-week backfill (~1,800 images) takes ~2.5h; normal rounds are minutes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Run ingest
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          GEMINI_MODEL: ${{ github.event.inputs.model || vars.GEMINI_MODEL || 'gemini-3.7-flash' }}
          TZ: Asia/Bangkok        # runner clock is UTC; the app stamps Bangkok — keep logs comparable
          INGEST_BATCH: ${{ github.event.inputs.live_read == 'true' && '0' || '1' }}
          INGEST_PARALLEL: "24"
          # 8 was the calm-down after a 32-fault network storm on 2026-08-26, before every Drive
          # call had a retry. With batch reading, downloads ARE the round — 19 images a minute
          # at 8 lanes puts a full week over the free Actions quota — so back up to 12.
          DRIVE_PARALLEL: "12"
        run: |
          ARGS=""
          # a person pressing the button always runs; the hourly schedule only runs when due
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --min-gap 3.5"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.exports_only }}" = "true" ]; then ARGS="$ARGS --exports-only"; fi
          if [ -n "${{ github.event.inputs.exports_jobs }}" ]; then ARGS="$ARGS --exports-jobs ${{ github.event.inputs.exports_jobs }}"; fi
          if [ -n "${{ github.event.inputs.redo_model }}" ]; then ARGS="$ARGS --redo-model ${{ github.event.inputs.redo_model }}"; fi
          if [ -n "${{ github.event.inputs.delete_jobs }}" ]; then ARGS="$ARGS --delete-jobs ${{ github.event.inputs.delete_jobs }}"; fi
          if [ -n "${{ github.event.inputs.delete_trips }}" ]; then ARGS="$ARGS --delete-trips ${{ github.event.inputs.delete_trips }}"; fi
          if [ "${{ github.event.inputs.dedupe_approved }}" = "true" ]; then ARGS="$ARGS --dedupe-approved"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python ingest.py $ARGS
