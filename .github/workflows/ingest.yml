name: Weekly ingest (Drive → Gemini → DB → Excel)

on:
  schedule:
    # Asked every hour; the gate job below decides in seconds whether a round is due
    # (round_gate.py): 2.5 hours since the last round, or sooner when Gemini answers have been
    # waiting 45 minutes. Collecting those answers is what puts work in the review queue, so the
    # old 3-hourly ask left it waiting a whole extra slot. Runs are free on a public repository;
    # the 3-hourly ask was a saving on the 2,000 private minutes.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force_walk:
        description: "เดินโฟลเดอร์ทุกอันแน่ ๆ (ใช้เมื่อวางโฟลเดอร์ใหม่แล้วรอบก่อนข้ามไป)"
        type: boolean
        default: false
      dry_run:
        description: "List only, don't process"
        type: boolean
        default: false
      limit:
        description: "Max images this run (blank = all)"
        type: string
        default: ""
      per_rider_saver:
        description: "โควตาต่อคนเฉพาะงาน 2 W Saver สำหรับรอบนี้เท่านั้น (ว่าง = 21; Standard และ 4W ยัง 21 เสมอ) — Ops สั่ง 2026-09-08 ให้ 2 W Saver วีคนี้ครบก่อน"
        type: string
        default: ""
      per_rider_standard:
        description: "โควตาต่อคนเฉพาะงาน 2 W Standard สำหรับรอบนี้เท่านั้น (ว่าง = 21) — เฟียส 2026-10-01: W39 ชื่อ 2W เต็มทั้ง 145 คน ให้คนเดิมรับเกิน 21"
        type: string
        default: ""
      exports_week:
        description: "คู่กับ exports_only: ทำรูปเฉพาะสัปดาห์นี้ (เช่น 2026-W37 หรือวันในสัปดาห์ 2026-09-07) · เว้นว่าง = ทุกสัปดาห์"
        type: string
        required: false
        default: ""
      exports_only:
        description: "Regenerate Excel + customer images only (no Gemini cost)"
        type: boolean
        default: false
      xlsx_only:
        description: "เขียน Rider Trips.xlsx ใหม่อย่างเดียว (ไม่สร้างรูป ไม่อ่าน AI) — ใช้เมื่อแก้กฎคอลัมน์"
        type: boolean
        default: false
      exports_jobs:
        description: "สร้างรูปส่งลูกค้าใหม่เฉพาะ job id (คั่นด้วยจุลภาค) — ไม่เสียค่า AI"
        type: string
        default: ""
      model:
        description: "Override model THIS run only (blank = default 3.7-flash)"
        type: string
        default: ""
      delete_jobs:
        description: "ลบ job ตาม id (คั่นด้วยจุลภาค) เช่น 167,168"
        type: string
        default: ""
      delete_trips:
        description: "ลบแถวตาม id (คั่นด้วยจุลภาค) — ใช้กับแถวซ้ำที่ตรวจรูปยืนยันแล้ว"
        type: string
        default: ""
      live_read:
        description: "อ่านสดรอบนี้ (ไม่ใช้ batch) — ผลมาทันทีแต่จ่ายเต็มราคา"
        type: boolean
        default: false
      stage_pool:
        description: "อ่านก่อนลงที่: กองพักคู่ที่จับได้ไว้ที่ <สัปดาห์>/_พร้อมอ่าน แล้วรอบนี้อ่านเสร็จค่อยลงโฟลเดอร์ไรเดอร์ตามสลิป (ทดลอง)"
        type: boolean
        default: false
      cancel_batches:
        description: "ยกเลิก batch ที่ค้าง แล้วอ่านรูปพวกนั้นแบบสดในรอบนี้ (จ่ายเต็มราคาเฉพาะรูปที่ค้าง · รูปใหม่รอบนี้ก็อ่านสด)"
        type: boolean
        default: false
      redo_model:
        description: "อ่านใหม่เฉพาะงานที่โมเดลนี้เคยอ่าน เช่น flash-lite (ตั้งช่อง model ข้างบนเป็นตัวที่จะใช้อ่านแทน)"
        type: string
        default: ""

jobs:
  # Outside the drive-write queue on purpose: GitHub keeps one waiting run per concurrency group,
  # so when every hourly tick queued there, a tick that was only going to say "not due" could
  # cancel a repair run somebody had just pressed. Asking costs a few seconds and touches nothing.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.ask.outputs.due || 'true' }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'schedule'
      - uses: actions/setup-python@v6
        if: github.event_name == 'schedule'
        with:
          python-version: "3.12"
      - run: pip install -q sqlalchemy "psycopg[binary]"
        if: github.event_name == 'schedule'
      - name: Is a round due?
        id: ask
        if: github.event_name == 'schedule'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TZ: Asia/Bangkok
        run: python round_gate.py

  ingest:
    needs: gate
    # a person pressing the button always runs; a scheduled tick only when the gate says so
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330  # a full-week backfill (~1,800 images) takes ~2.5h; normal rounds are minutes
    # One group for everything that writes to Drive, so a repair tool and a round never move the
    # same files at once; they queue instead. Runs are free on a public repository.
    concurrency:
      group: drive-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # opencv (pulled in by the free OCR) needs libgl1/libglib; the duplicate example pictures need a
      # Thai font, and libfribidi lets Pillow place Thai tone marks
      - run: sudo apt-get install -y -qq libgl1 libglib2.0-0 fonts-thai-tlwg libfribidi0
      - run: pip install -r backend/requirements.txt -r backend/requirements-pairing.txt
      - name: Run ingest
        working-directory: backend
        env:
          QUOTA_2_W_SAVER: ${{ github.event.inputs.per_rider_saver || '' }}
          QUOTA_2_W_STANDARD: ${{ github.event.inputs.per_rider_standard || '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          GEMINI_MODEL: ${{ github.event.inputs.model || vars.GEMINI_MODEL || 'gemini-3.7-flash' }}
          # every line of the passenger's fare block, one field each — off until W38's re-read has
          # measured it; switched on for good with the repository variable PASSENGER_LINES=1
          PASSENGER_LINES: ${{ vars.PASSENGER_LINES || '0' }}
          TZ: Asia/Bangkok        # runner clock is UTC; the app stamps Bangkok — keep logs comparable
          # 0 turns the 'anything new?' probe off for this run, so the whole Inbox is walked.
          # Moving files into a folder does not change their modifiedTime, so a delivery can be
          # invisible to the probe; this is the way to make a round look anyway.
          DRIVE_PROBE: ${{ github.event.inputs.force_walk == 'true' && '0' || '1' }}
          # cancelling a stalled batch means Google's queue is not to be trusted this round —
          # new pictures are read live too, not handed to the same queue
          INGEST_BATCH: ${{ (github.event.inputs.live_read == 'true' || github.event.inputs.cancel_batches == 'true') && '0' || '1' }}
          # read-then-file. The tick box turns it on for one round; otherwise the repository
          # variable decides, so it can be switched on for good (or off again in one edit)
          # without touching this file. Tried on W38 on 2026-09-17: 47 car trips were read in the
          # waiting room and filed into three Taxi riders' folders, pictures moved once.
          POOL_STAGE: ${{ github.event.inputs.stage_pool == 'true' && '1' || vars.POOL_STAGE || '0' }}
          INGEST_PARALLEL: "24"
          # 8 was the calm-down after a 32-fault network storm on 2026-08-26, before every Drive
          # call had a retry. With batch reading, downloads ARE the round — 19 images a minute
          # at 8 lanes puts a full week over the free Actions quota — so back up to 12.
          DRIVE_PARALLEL: "12"
        run: |
          ARGS=""
          # a person pressing the button always runs; a scheduled one only runs when due
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --min-gap 2.5"; fi   # asks the gate again: a round may have finished while this one queued
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.cancel_batches }}" = "true" ]; then ARGS="$ARGS --cancel-batches"; fi
          if [ "${{ github.event.inputs.exports_only }}" = "true" ]; then ARGS="$ARGS --exports-only"; fi
          if [ "${{ github.event.inputs.xlsx_only }}" = "true" ]; then ARGS="$ARGS --xlsx-only"; fi
          if [ -n "${{ github.event.inputs.exports_jobs }}" ]; then ARGS="$ARGS --exports-jobs ${{ github.event.inputs.exports_jobs }}"; fi
          if [ -n "${{ github.event.inputs.exports_week }}" ]; then ARGS="$ARGS --exports-week ${{ github.event.inputs.exports_week }}"; fi
          if [ -n "${{ github.event.inputs.redo_model }}" ]; then ARGS="$ARGS --redo-model ${{ github.event.inputs.redo_model }}"; fi
          if [ -n "${{ github.event.inputs.delete_jobs }}" ]; then ARGS="$ARGS --delete-jobs ${{ github.event.inputs.delete_jobs }}"; fi
          if [ -n "${{ github.event.inputs.delete_trips }}" ]; then ARGS="$ARGS --delete-trips ${{ github.event.inputs.delete_trips }}"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python ingest.py $ARGS
      # A cancelled or timed-out round is killed before it can stamp its own row, and an unstamped
      # row reads as "a round is running" to the gate. Stamp it here; round_gate also treats a row
      # older than 6 hours as dead, in case this step itself never runs.
      - name: Mark the round as stopped
        if: failure() || cancelled()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -c "update ingest_runs set finished_at = to_char(now() at time zone 'Asia/Bangkok', 'YYYY-MM-DD\"T\"HH24:MI:SS'), errors = coalesce(errors, 0) + 1, notes = 'รอบนี้ถูกยกเลิกหรือหมดเวลา (GitHub Actions run ${{ github.run_id }})' where finished_at is null" || true
