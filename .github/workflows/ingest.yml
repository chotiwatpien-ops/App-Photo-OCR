name: Weekly ingest (Drive → Gemini → DB → Excel)

on:
  schedule:
    - cron: "0 22 * * *"            # 05:00 Asia/Bangkok, daily (UTC+7)
    - cron: "30 4 * * *"            # 11:30 Asia/Bangkok
    - cron: "0 11 * * *"            # 18:00 Asia/Bangkok
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List only, don't process"
        type: boolean
        default: false
      limit:
        description: "Max images this run (blank = all)"
        type: string
        default: ""
      exports_only:
        description: "Regenerate Excel + customer images only (no Gemini cost)"
        type: boolean
        default: false
      fix_hidden_turbo:
        description: "เติม Turbo จากส่วนต่าง (เคสรูปพับหัวข้อ) — DB only"
        type: boolean
        default: false
      model:
        description: "Override model THIS run only (blank = default 3.7)"
        type: string
        default: ""
      redo_lite:
        description: "ลบผลอ่านของโมเดล lite แล้วอ่านซ้ำด้วย 3.7 ในรอบนี้"
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # a full-week backfill (~1,800 images) takes ~2.5h; normal rounds are minutes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Run ingest
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          GEMINI_MODEL: ${{ github.event.inputs.model || vars.GEMINI_MODEL || 'gemini-3.7-flash' }}
          INGEST_PARALLEL: "12"
          DRIVE_PARALLEL: "8"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.exports_only }}" = "true" ]; then ARGS="$ARGS --exports-only"; fi
          if [ "${{ github.event.inputs.fix_hidden_turbo }}" = "true" ]; then ARGS="$ARGS --fix-hidden-turbo"; fi
          if [ "${{ github.event.inputs.redo_lite }}" = "true" ]; then ARGS="$ARGS --redo-model flash-lite"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python ingest.py $ARGS
