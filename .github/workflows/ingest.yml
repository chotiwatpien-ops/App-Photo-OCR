name: Weekly ingest (Drive → Gemini → DB → Excel)

on:
  schedule:
    # GitHub fires about one scheduled run in three, 20-95 minutes late (measured 2026-08-24..28:
    # 8 runs where ~25 were due), so the round itself decides whether it is due — the gate below
    # ends an early one in seconds, long before any real work.
    #
    # Asked every 3 hours, not hourly. Billing rounds each job up to a whole minute, so the ~17
    # not-due runs an hourly schedule produced were costing ~510 minutes a month of the 2,000
    # free ones to answer one question and quit. Three-hourly asks 8 times and, with the gap
    # below at 2.5h, every ask is due: no minute is spent on a run that does nothing, and photos
    # wait 3 hours instead of 3.5.
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      force_walk:
        description: "เดินโฟลเดอร์ทุกอันแน่ ๆ (ใช้เมื่อวางโฟลเดอร์ใหม่แล้วรอบก่อนข้ามไป)"
        type: boolean
        default: false
      dry_run:
        description: "List only, don't process"
        type: boolean
        default: false
      limit:
        description: "Max images this run (blank = all)"
        type: string
        default: ""
      per_rider:
        description: "โควตาต่อคนสำหรับรอบนี้เท่านั้น (ว่าง = 21) — Ops สั่ง 2026-09-08 ให้วีคนี้ครบก่อนแม้เกิน 21"
        type: string
        default: ""
      exports_only:
        description: "Regenerate Excel + customer images only (no Gemini cost)"
        type: boolean
        default: false
      xlsx_only:
        description: "เขียน Rider Trips.xlsx ใหม่อย่างเดียว (ไม่สร้างรูป ไม่อ่าน AI) — ใช้เมื่อแก้กฎคอลัมน์"
        type: boolean
        default: false
      exports_jobs:
        description: "สร้างรูปส่งลูกค้าใหม่เฉพาะ job id (คั่นด้วยจุลภาค) — ไม่เสียค่า AI"
        type: string
        default: ""
      model:
        description: "Override model THIS run only (blank = default 3.7-flash)"
        type: string
        default: ""
      delete_jobs:
        description: "ลบ job ตาม id (คั่นด้วยจุลภาค) เช่น 167,168"
        type: string
        default: ""
      delete_trips:
        description: "ลบแถวตาม id (คั่นด้วยจุลภาค) — ใช้กับแถวซ้ำที่ตรวจรูปยืนยันแล้ว"
        type: string
        default: ""
      dedupe_approved:
        description: "ลบแถวอนุมัติซ้ำ (booking code ซ้ำของไรเดอร์คนเดียวกัน)"
        type: boolean
        default: false
      live_read:
        description: "อ่านสดรอบนี้ (ไม่ใช้ batch) — ผลมาทันทีแต่จ่ายเต็มราคา"
        type: boolean
        default: false
      redo_model:
        description: "อ่านใหม่เฉพาะงานที่โมเดลนี้เคยอ่าน เช่น flash-lite (ตั้งช่อง model ข้างบนเป็นตัวที่จะใช้อ่านแทน)"
        type: string
        default: ""

# One group for everything that writes to Drive. Each of these used to hold a group of
# its own name, which stops a second copy of itself and nothing else — so a quota apply
# and an ingest round could move the same files and rewrite the same customer images at
# the same time, and nothing anywhere would have noticed. Sharing the group makes them
# queue instead. Runs are free on a public repository, so waiting costs nothing.
concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # a full-week backfill (~1,800 images) takes ~2.5h; normal rounds are minutes
    steps:
      - uses: actions/checkout@v4
      # GitHub fires roughly one scheduled run in three, late and unevenly, so a run still has to
      # ask whether it is due — and asking used to cost ~90s of installing Python packages first,
      # which is where most of the free Actions quota went. psql ships with the runner, so the
      # same question costs ~2s here. The gap is 2.5h against a 3-hourly schedule: wide enough
      # that a run arriving 20-95 minutes late is still the only one working, narrow enough that
      # no scheduled run is turned away (at 3.5h every other one would be, halving the cadence).
      # Fail-open: an unreadable answer runs the round, so a check can never cost us one.
      - name: Is a round due?
        id: gate
        if: github.event_name == 'schedule'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          age=$(psql "$DATABASE_URL" -tAc "select coalesce(extract(epoch from ((now() at time zone 'Asia/Bangkok') - max(finished_at)::timestamp))/3600, 999) from ingest_runs where finished_at is not null" 2>/dev/null | tr -d '[:space:]')
          running=$(psql "$DATABASE_URL" -tAc "select count(*) from ingest_runs where finished_at is null and started_at::timestamp > (now() at time zone 'Asia/Bangkok') - interval '6 hours'" 2>/dev/null | tr -d '[:space:]')
          echo "รอบล่าสุดจบไปแล้ว ${age:-?} ชม. · กำลังรันอยู่ ${running:-?} รอบ"
          if [ -n "$age" ] && [ -n "$running" ] && awk "BEGIN{exit !($age < 2.5 || $running > 0)}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "⏭ ยังไม่ถึงเวลา (หรือมีรอบกำลังรัน) — จบรอบนี้โดยไม่ติดตั้งอะไร"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq libgl1 libglib2.0-0   # opencv (pulled in by the free OCR) needs them
        if: steps.gate.outputs.skip != 'true'
      - run: pip install -r backend/requirements.txt -r backend/requirements-pairing.txt
        if: steps.gate.outputs.skip != 'true'
      - name: Run ingest
        if: steps.gate.outputs.skip != 'true' 
        working-directory: backend
        env:
          EXPECTED_TRIPS_PER_WEEK: ${{ github.event.inputs.per_rider || '21' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          GEMINI_MODEL: ${{ github.event.inputs.model || vars.GEMINI_MODEL || 'gemini-3.7-flash' }}
          TZ: Asia/Bangkok        # runner clock is UTC; the app stamps Bangkok — keep logs comparable
          # 0 turns the 'anything new?' probe off for this run, so the whole Inbox is walked.
          # Moving files into a folder does not change their modifiedTime, so a delivery can be
          # invisible to the probe; this is the way to make a round look anyway.
          DRIVE_PROBE: ${{ github.event.inputs.force_walk == 'true' && '0' || '1' }}
          INGEST_BATCH: ${{ github.event.inputs.live_read == 'true' && '0' || '1' }}
          INGEST_PARALLEL: "24"
          # 8 was the calm-down after a 32-fault network storm on 2026-08-26, before every Drive
          # call had a retry. With batch reading, downloads ARE the round — 19 images a minute
          # at 8 lanes puts a full week over the free Actions quota — so back up to 12.
          DRIVE_PARALLEL: "12"
        run: |
          ARGS=""
          # a person pressing the button always runs; a scheduled one only runs when due
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --min-gap 2.5"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ github.event.inputs.exports_only }}" = "true" ]; then ARGS="$ARGS --exports-only"; fi
          if [ "${{ github.event.inputs.xlsx_only }}" = "true" ]; then ARGS="$ARGS --xlsx-only"; fi
          if [ -n "${{ github.event.inputs.exports_jobs }}" ]; then ARGS="$ARGS --exports-jobs ${{ github.event.inputs.exports_jobs }}"; fi
          if [ -n "${{ github.event.inputs.redo_model }}" ]; then ARGS="$ARGS --redo-model ${{ github.event.inputs.redo_model }}"; fi
          if [ -n "${{ github.event.inputs.delete_jobs }}" ]; then ARGS="$ARGS --delete-jobs ${{ github.event.inputs.delete_jobs }}"; fi
          if [ -n "${{ github.event.inputs.delete_trips }}" ]; then ARGS="$ARGS --delete-trips ${{ github.event.inputs.delete_trips }}"; fi
          if [ "${{ github.event.inputs.dedupe_approved }}" = "true" ]; then ARGS="$ARGS --dedupe-approved"; fi
          if [ -n "${{ github.event.inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"; fi
          python ingest.py $ARGS
