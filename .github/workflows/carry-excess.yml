name: Carry excess — ยกงานที่เกินเป้าของแต่ละกลุ่มไปสัปดาห์ถัดไป

# The customer takes a fixed number of trips per vehicle group per week. Once the chip audit
# and the rehome have put every row where its slip says, a group can hold more than that; the
# rows above it go into the next week's file rather than being cut (Fiat, 2026-09-10). Latest
# trips first — nearest the week they move into. The date on the row stays the date on the
# slip. The row moves to a job under next week's dates, its stitched picture into next week's
# rider folder, and its delivered picture out of this week's Export Pic into _แทนที่แล้ว, so
# next week's export names it afresh. Then run ingest with exports_only for both weeks.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "ชื่อโฟลเดอร์สัปดาห์นี้บน Drive"
        type: string
        required: true
        default: "Week 31 Aug-6 Sep"
      date_from:
        description: "วันแรกของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-08-31"
      date_to:
        description: "วันสุดท้ายของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-09-06"
      target:
        description: "งานต่อกลุ่มที่ลูกค้ารับ"
        type: string
        required: true
        default: "1470"
      apply:
        description: "ยกจริง (ไม่ติ๊ก = รายงานอย่างเดียว)"
        type: boolean
        default: false

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  carry:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: ยกงานที่เกินไปสัปดาห์หน้า
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          TZ: Asia/Bangkok
        run: |
          ARGS="--week '${{ github.event.inputs.week }}' --from ${{ github.event.inputs.date_from }} --to ${{ github.event.inputs.date_to }} --target ${{ github.event.inputs.target }}"
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          eval python carry_excess.py $ARGS
