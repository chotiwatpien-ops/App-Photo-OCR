name: Settle doubles — ถอดเที่ยวที่ถูกอนุมัติสองครั้ง (เลขจองอ่านเพี้ยน)

# A slip screenshotted twice whose booking code the reader got two ways at the line break was
# approved twice (W46, ฿38). This keeps the first approved row, parks the later ones as
# duplicates, moves their customer pictures to <group>/_ซ้ำ and writes the week's file again.
# Same-route groups are listed for a person and left alone. Closed weeks are never touched.
# Report-only unless `apply` is ticked.

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "วันแรกของสัปดาห์ (จันทร์) เช่น 2026-11-09"
        type: string
        default: "2026-11-09"
      date_to:
        description: "วันสุดท้ายของสัปดาห์ เช่น 2026-11-15"
        type: string
        default: "2026-11-15"
      apply:
        description: "ถอดจริง (ไม่ติ๊ก = รายงานอย่างเดียว)"
        type: boolean
        default: false

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Settle the week
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          TZ: Asia/Bangkok
          DFROM: ${{ inputs.date_from }}
          DTO: ${{ inputs.date_to }}
        run: |
          echo "ได้รับ: $DFROM..$DTO apply='${{ inputs.apply }}'"
          set -- --from "$DFROM" --to "$DTO"
          if [ "${{ inputs.apply }}" = "true" ]; then set -- "$@" --apply; fi
          python -u settle_doubles.py "$@"
