name: Clear Drive — ย้ายไฟล์ของระบบในสัปดาห์ที่ปิดแล้วไปถังขยะ

# Frees the system account's Drive space (94% of 15 GB on 2026-11-05). Ops confirmed that closed
# weeks' customer pictures, stitched pairs, _แทนที่แล้ว, _เติมงาน Ops, _ซ้ำ and the system's own
# files in _ใช้แล้ว may go. Only files the system account owns, only weeks that are closed in
# the database. Without `apply` it only reports. Trashed files stay recoverable for 30 days; the
# space comes back when the account's trash is emptied. Safe to run again.

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "สัปดาห์ที่จะเคลียร์ (คั่นด้วยจุลภาค) ต้องปิดแล้วเท่านั้น"
        type: string
        required: true
        default: "2026-W33,2026-W34,2026-W35,2026-W36,2026-W37,2026-W38,2026-W39"
      apply:
        description: "ย้ายไปถังขยะจริง (ไม่ติ๊ก = รายงานอย่างเดียว)"
        type: boolean
        default: false

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Clear closed weeks
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          TZ: Asia/Bangkok
          WEEKS: ${{ inputs.weeks }}
        run: |
          set -- --weeks "$WEEKS"
          if [ "${{ inputs.apply }}" = "true" ]; then set -- "$@" --apply; fi
          python -u clear_drive.py "$@"
