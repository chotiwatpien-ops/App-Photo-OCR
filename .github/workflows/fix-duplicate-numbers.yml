name: Fix duplicate numbers — ล้างชื่อรูปส่งลูกค้าที่ซ้ำกัน ให้ตั้งใหม่

# Customer pictures were numbered inside one job until 2026-09-11, and rehome and carry give a
# rider two or three jobs in one week — so 'WK36-สมชาย1.jpg' ended up on two rows. Numbering now
# runs against the week, which stops new collisions; this clears the ones already made. Only the
# later row of each name gives it up, so the first row keeps the name Ops already have. Nothing
# is deleted: the file standing under the shared name is parked in _แทนที่แล้ว, because two rows
# claimed it and only one still owns it. Then run ingest with exports_only for that week.

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "วันแรกของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-09-07"
      date_to:
        description: "วันสุดท้ายของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-09-13"
      apply:
        description: "ล้างจริง (ไม่ติ๊ก = รายงานอย่างเดียว)"
        type: boolean
        default: false

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: ล้างชื่อรูปที่ซ้ำ
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          TZ: Asia/Bangkok
        run: |
          ARGS="--from ${{ github.event.inputs.date_from }} --to ${{ github.event.inputs.date_to }}"
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          python fix_duplicate_numbers.py $ARGS
