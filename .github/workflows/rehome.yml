name: Rehome by service — ย้ายแถวและรูปไปกลุ่มที่ประเภทงานบอก

# After the chip audit writes what the slip says, a row can read 'Saver Bike' under a job that
# was opened as 2 W Standard. The label alone fixes nothing downstream: the folder a customer
# picture is delivered to comes from job.category (ingest.export_only), and the stitched
# picture sits in the old group's rider folder. Ops reads both. So each such row moves to a job
# of the right group for the same rider and week (made if absent, with its own rider folder),
# its stitched picture moves with it, and its delivered picture moves across Export Pic keeping
# its name. Nothing is deleted, no row is re-read. Then run ingest with xlsx_only.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "ชื่อโฟลเดอร์สัปดาห์บน Drive"
        type: string
        required: true
        default: "Week 31 Aug-6 Sep"
      date_from:
        description: "วันแรกของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-08-31"
      date_to:
        description: "วันสุดท้ายของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-09-06"
      apply:
        description: "ย้ายจริง (ไม่ติ๊ก = รายงานอย่างเดียว)"
        type: boolean
        default: false

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  rehome:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: ย้ายแถวและรูปตามประเภทงาน
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          TZ: Asia/Bangkok
        run: |
          ARGS="--week '${{ github.event.inputs.week }}' --from ${{ github.event.inputs.date_from }} --to ${{ github.event.inputs.date_to }}"
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          eval python rehome_by_service.py $ARGS
