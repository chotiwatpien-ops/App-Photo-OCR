name: Old-screen fees — เติม Passenger Fare ของสลิปจอเก่า (อ่าน live)

# The old Grab screen has no 'ยอดที่ผู้โดยสารชำระ' line, so its rows went out with Passenger Fare
# empty, and their app fee in the old screen's sign made Total Commission wrong (Ops, W34 4W,
# 2026-09-28). This reads the old card's Total and lines again, turns them into the new screen's
# signs, and writes only rows that add up to their own ride fare. See backend/reread_old_fees.py.

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "วันจันทร์ของแต่ละสัปดาห์ คั่นด้วยจุลภาค"
        type: string
        default: "2026-08-17,2026-08-24"
      limit:
        description: "อ่านไม่เกินกี่แถว (ว่าง = ทุกแถว)"
        type: string
        default: ""
      arith:
        description: "ไม่อ่านรูป: Ride Fare = ค่ารอบ + ส่วนที่ Grab ได้ ให้แถวที่เป็นค่าประมาณ"
        type: boolean
        default: false
      apply:
        description: "เขียนจริง (ไม่ติ๊ก = รายงานอย่างเดียว)"
        type: boolean
        default: false

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  reread:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Read the old fee card again
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.7-flash' }}
          TZ: Asia/Bangkok
          WEEKS: ${{ inputs.weeks }}
          LIMIT: ${{ inputs.limit }}
        run: |
          echo "ได้รับ: weeks='$WEEKS' limit='$LIMIT' apply='${{ inputs.apply }}'"
          set -- --weeks "$WEEKS"
          if [ -n "$LIMIT" ]; then set -- "$@" --limit "$LIMIT"; fi
          if [ "${{ inputs.apply }}" = "true" ]; then set -- "$@" --apply; fi
          if [ "${{ inputs.arith }}" = "true" ]; then set -- "$@" --arith; fi
          python -u reread_old_fees.py "$@"
