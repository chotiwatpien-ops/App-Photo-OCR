name: Refill weeks — เติมงานสัปดาห์ที่ส่งแล้ว จากโฟลเดอร์ของ Ops (เฉพาะกลุ่มที่ยังขาด)

# Ops' folder tops up W34 and W35 only (Fiat 2026-09-23): the groups still under target, riders
# already working the week (past 21 each), dates inside the week. `read` pairs and reads the
# pictures into the first week's waiting job, where they count nowhere; `plan` says what would be
# filed where and why the rest would not; `apply` files it. See backend/refill_weeks.py.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "id โฟลเดอร์รูป คั่นด้วยจุลภาค (โฟลเดอร์ย่อยแต่ละอันคือหนึ่งอัลบั้ม)"
        type: string
        default: "15CIgupP60sZ0k7uo16hSbZh1dPVSgd7n"
      weeks:
        description: "วันจันทร์ของสัปดาห์ที่จะเติม เรียงตามลำดับที่เติมก่อน"
        type: string
        default: "2026-08-17,2026-08-24"
      mode:
        description: "read = จับคู่และอ่านรูป · plan = ดูแผน · apply = ลงงานจริง"
        type: choice
        options: [plan, read, apply]
        default: plan
      report:
        description: "โฟลเดอร์ใน Exports ที่วางไฟล์แผนรายเที่ยว (ว่าง = ไม่เขียน)"
        type: string
        default: "งานแก้ W34-W35"

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq libgl1 libglib2.0-0   # opencv (pulled in by the free OCR) needs them
      - run: pip install -r backend/requirements.txt -r backend/requirements-pairing.txt
      - name: Refill
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.7-flash' }}
          PASSENGER_LINES: ${{ vars.PASSENGER_LINES || '0' }}
          DRIVE_PARALLEL: "12"
          TZ: Asia/Bangkok
          SOURCE: ${{ inputs.source }}
          WEEKS: ${{ inputs.weeks }}
          MODE: ${{ inputs.mode }}
          REPORT: ${{ inputs.report }}
        run: |
          echo "ได้รับ: source='$SOURCE' weeks='$WEEKS' mode='$MODE'"
          set -- --source "$SOURCE" --weeks "$WEEKS" --report "$REPORT"
          if [ "$MODE" = "read" ]; then set -- "$@" --read; fi
          if [ "$MODE" = "apply" ]; then set -- "$@" --apply; fi
          python -u refill_weeks.py "$@"
