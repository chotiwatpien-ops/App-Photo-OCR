name: Recut date bar — ตัดแถบวันที่ที่ยังติดอยู่บนรูปของสัปดาห์

# Before r15 the pool cut a top half under the phone's status bar instead of under the date bar,
# so the slip date stayed on the customer picture. This finds those pictures in one week, cuts the
# bar, keeps the old bytes in Exports/_ก่อนตัดวันที่/<week>/ and remakes the customer picture.
# Report-only unless `apply` is ticked.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "วันแรกของสัปดาห์ (เช่น 2026-11-16)"
        type: string
        default: ""
      apply:
        description: "ทำจริง (ไม่ติ๊ก = รายงานอย่างเดียว ไม่แตะอะไร)"
        type: boolean
        default: false
      restore:
        description: "ชื่อรูปที่ถูกตัดเกิน คั่นด้วย , — ทำใหม่จากต้นฉบับที่เก็บไว้ (ชื่อ:N = ตัดบนออก N แถว, ชื่อ:0 = คืนตามเดิม, ว่าง = ตรวจทั้งสัปดาห์ตามปกติ)"
        type: string
        default: ""

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  recut:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq libgl1 libglib2.0-0   # opencv (pulled in by the OCR) needs them
      - run: pip install -r backend/requirements.txt -r backend/requirements-pairing.txt
      - name: Recut
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          WEEK: ${{ github.event.inputs.week }}
          RESTORE: ${{ github.event.inputs.restore }}
          TZ: Asia/Bangkok
        run: |
          ARGS=(--week "$WEEK")
          if [ -n "$RESTORE" ]; then ARGS+=(--restore "$RESTORE"); fi
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS+=(--apply); fi
          python recut_date_bar.py "${ARGS[@]}"
