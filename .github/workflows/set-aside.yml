name: Set aside — ดึงงานของไรเดอร์คนหนึ่งออกจากสัปดาห์ ไปเป็นไฟล์ + โฟลเดอร์รูปของตัวเอง

# Ops 2026-09-21: 20 urgent 2 W Saver fix-ups from one rider, out of W38, delivered on their own
# with only their pictures and dated into 24–30 Aug; W38's count drops by them. Rows are never
# deleted: they take the status 'set_aside', which no weekly file or count reads. Their delivered
# pictures are copied under the new week's names into the batch folder (the old ones go to the
# week's _แทนที่แล้ว), the stitched originals into its _ต้นฉบับ, and the batch's workbook is
# written beside them. Then run ingest with xlsx_only so the week's file loses them.
#
# Report-only unless `apply` is ticked. `expect` stops it when the count is not what Ops asked for.

on:
  workflow_dispatch:
    inputs:
      rider:
        description: "ชื่อไรเดอร์ (ตรงกับในระบบ)"
        type: string
        default: "สรธร Home"
      group:
        description: "กลุ่ม"
        type: string
        default: "2 W Saver"
      week_from:
        description: "สัปดาห์ที่ดึงออก: วันแรก"
        type: string
        default: "2026-09-14"
      week_to:
        description: "สัปดาห์ที่ดึงออก: วันสุดท้าย"
        type: string
        default: "2026-09-20"
      new_from:
        description: "วันที่ในไฟล์ใหม่: วันแรก"
        type: string
        default: "2026-08-24"
      new_to:
        description: "วันที่ในไฟล์ใหม่: วันสุดท้าย"
        type: string
        default: "2026-08-30"
      name:
        description: "ชื่อชุดงาน (ชื่อโฟลเดอร์ใน Export Pic และชื่อไฟล์)"
        type: string
        default: "งานแก้ 2W Saver 24-30 Aug"
      expect:
        description: "จำนวนงานที่ต้องได้ (ไม่ตรง = ไม่ทำ)"
        type: string
        default: "20"
      apply:
        description: "ทำจริง (ไม่ติ๊ก = รายงานอย่างเดียว)"
        type: boolean
        default: false

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  aside:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Set the rider's trips aside
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          TZ: Asia/Bangkok
          RIDER: ${{ inputs.rider }}
          GROUP: ${{ inputs.group }}
          WFROM: ${{ inputs.week_from }}
          WTO: ${{ inputs.week_to }}
          NFROM: ${{ inputs.new_from }}
          NTO: ${{ inputs.new_to }}
          NAME: ${{ inputs.name }}
          EXPECT: ${{ inputs.expect }}
        run: |
          echo "ได้รับ: rider='$RIDER' group='$GROUP' week=$WFROM..$WTO new=$NFROM..$NTO name='$NAME' expect='$EXPECT' apply='${{ inputs.apply }}'"
          # names carry spaces and Thai — passed through the environment, never re-parsed
          set -- --rider "$RIDER" --group "$GROUP" --from "$WFROM" --to "$WTO" \
                 --new-from "$NFROM" --new-to "$NTO" --name "$NAME"
          if [ -n "$EXPECT" ]; then set -- "$@" --expect "$EXPECT"; fi
          if [ "${{ inputs.apply }}" = "true" ]; then set -- "$@" --apply; fi
          python -u set_aside.py "$@"
