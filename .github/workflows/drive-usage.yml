name: Drive usage — พื้นที่ Drive แยกตามสัปดาห์ (อ่านอย่างเดียว)

# Drive was close to full before reopening (2026-11-05). This walks the Inbox and the Exports
# folder and sums every file by week and kind of folder, with how much of it the system account
# owns, so a clean-up starts from numbers rather than guesses. It moves and deletes nothing.
# The result is on the run's Summary page. It names weeks and folder kinds only, never a file or
# a rider: this repository is public and so are its Actions logs.
#
# Its own concurrency group, not drive-write: it writes nothing, and a newer run queued in a
# shared group would cancel an older pending one.

on:
  workflow_dispatch:

concurrency:
  group: drive-usage
  cancel-in-progress: false

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Sum Drive space by week
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          TZ: Asia/Bangkok
        run: python -u drive_usage.py
