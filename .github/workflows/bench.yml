name: Model benchmark (accuracy vs approved data)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Candidate model"
        type: choice
        default: gemini-2.5-flash-lite
        options:
          - gemini-3.5-flash-lite
          - gemini-3.1-flash-lite
          - gemini-2.5-flash-lite
          - gemini-2.5-flash
          - gemini-3.7-flash
      sample:
        description: "Sample size (images)"
        type: string
        default: "100"

# One group for everything that writes to Drive. Each of these used to hold a group of
# its own name, which stops a second copy of itself and nothing else — so a quota apply
# and an ingest round could move the same files and rewrite the same customer images at
# the same time, and nothing anywhere would have noticed. Sharing the group makes them
# queue instead. Runs are free on a public repository, so waiting costs nothing.
concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Run benchmark
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          GEMINI_THINKING_BUDGET: "0"
        run: python model_bench.py --model "${{ github.event.inputs.model }}" --sample "${{ github.event.inputs.sample }}"
