name: รายงานรูปซ้ำ — ให้ลูกค้าตีกลับไรเดอร์

# ไม่แตะฐานข้อมูล: ประกอบเคสรูปซ้ำของสัปดาห์ที่เลือก เป็น Excel สามชีต (สรุปรายผู้ส่ง · รายใบ ·
# ค้างตัดสิน) แล้ววางลง Drive ที่ Exports/_รายงานรูปซ้ำ/รูปซ้ำ_<สัปดาห์>.xlsx แยกจากไฟล์หลักที่ส่งลูกค้า
# ทับฉบับเดิมของสัปดาห์เดียวกันทุกครั้ง ยังแนบไว้ที่หน้า run (Artifacts) ด้วยเผื่อ Drive มีปัญหา
#
# ไม่อยู่ในคิว drive-write: เขียนไฟล์ของตัวเองในโฟลเดอร์ของตัวเองเท่านั้น ไม่มีรอบไหนแตะไฟล์นี้
# ถ้าเข้าคิวจะต้องรอหลังรอบ ingest 25 นาทีเพื่อเขียนไฟล์ที่ไม่มีใครแย่งเลย

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "วันแรกของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-09-07"
      date_to:
        description: "วันสุดท้ายของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-09-13"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: ประกอบเคสรูปซ้ำ
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          TZ: Asia/Bangkok
        run: |
          python duplicate_report.py \
            --from "${{ github.event.inputs.date_from }}" \
            --to "${{ github.event.inputs.date_to }}" \
            --xlsx "รูปซ้ำ_${{ github.event.inputs.date_from }}.xlsx" \
            --to-drive
      - uses: actions/upload-artifact@v4
        with:
          name: duplicate-report-${{ github.event.inputs.date_from }}
          path: backend/*.xlsx
          if-no-files-found: warn
          retention-days: 30
