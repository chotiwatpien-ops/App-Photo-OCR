name: Close week — ปิดสัปดาห์ในครั้งเดียว (ปุ่มบนเว็บ)

# What the web's 'ปิดสัปดาห์' tab starts. Runs backend/close_week.py: rehome → carry excess →
# carry back → move staged → pictures of both weeks → Phase 3 file → audit → lock, writing each
# step's outcome to the close_runs table, which the page reads. mode=plan does every step
# report-only. Normally pressed from the web, which creates the close_runs row and passes its id;
# pressed here by hand, leave run_id empty and a row is made.
#
# Its own concurrency group, not drive-write: GitHub lets a newer pending run in a group cancel an
# older pending one, so a scheduled ingest queued behind would silently cancel the close. The two
# keep apart through the database instead — ingest skips its round while a close is active.

on:
  workflow_dispatch:
    inputs:
      week_from:
        description: "วันแรกของสัปดาห์ (จันทร์) เช่น 2026-09-21"
        type: string
        required: true
      week_to:
        description: "วันสุดท้ายของสัปดาห์ เช่น 2026-09-27"
        type: string
        required: true
      mode:
        description: "plan = ดูแผนอย่างเดียว · apply = ปิดจริง"
        type: choice
        options: [plan, apply]
        default: plan
      run_id:
        description: "เลขรอบปิดที่เว็บสร้างไว้ (ว่างได้)"
        type: string
        default: ""

concurrency:
  group: close-week
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq libgl1 libglib2.0-0   # opencv, pulled in by the pairing OCR that ingest imports
      - run: pip install -r backend/requirements.txt -r backend/requirements-pairing.txt
      - name: Close the week
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          TZ: Asia/Bangkok
          WFROM: ${{ inputs.week_from }}
          WTO: ${{ inputs.week_to }}
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -- --from "$WFROM" --to "$WTO" --mode "$MODE"
          if [ -n "$RUN_ID" ]; then set -- "$@" --run-id "$RUN_ID"; fi
          python -u close_week.py "$@"
      - name: Tell the page this run died
        if: failure() && inputs.run_id != ''
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_ID: ${{ inputs.run_id }}
        run: python close_week.py --mark-failed "$RUN_ID"
