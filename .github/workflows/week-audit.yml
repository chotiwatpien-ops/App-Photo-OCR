name: Week audit — ตรวจสัปดาห์ที่ส่งแล้วจากฐานข้อมูล (อ่านอย่างเดียว)

# Lists what is wrong with one delivered week, each kind of fault on its own sheet: one booking
# code on two rows, rows equal in every column with nothing to tell them apart, a base fare of 0,
# a green figure that is not base + bonus, a passenger block that does not add up, missing places,
# picture names used twice, pictures missing on Drive. Reads the database; changes nothing.

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "วันแรกของสัปดาห์ (จันทร์) เช่น 2026-08-24"
        type: string
        default: "2026-08-24"
      date_to:
        description: "วันสุดท้ายของสัปดาห์ เช่น 2026-08-30"
        type: string
        default: "2026-08-30"
      to_drive:
        description: "วางรายงานลง Drive ที่ Exports/_ตรวจสัปดาห์ และตรวจรูปบน Drive ด้วย"
        type: boolean
        default: false

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Audit the week
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          TZ: Asia/Bangkok
          DFROM: ${{ inputs.date_from }}
          DTO: ${{ inputs.date_to }}
        run: |
          echo "ได้รับ: $DFROM..$DTO to_drive='${{ inputs.to_drive }}'"
          set -- --from "$DFROM" --to "$DTO"
          if [ "${{ inputs.to_drive }}" = "true" ]; then set -- "$@" --to-drive; fi
          python -u week_audit.py "$@"
