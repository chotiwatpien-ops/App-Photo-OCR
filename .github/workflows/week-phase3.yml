name: Week in Phase 3 — ออกไฟล์ของสัปดาห์เดียวในรูปแบบ Phase 3 (ไฟล์แยก)

# A delivered week, written again in the layout the customer reads from W38 on, as its own file
# next to the weekly ones: "Rider Trips 2026-W35 Phase 3.xlsx". The delivered Rider Trips.xlsx is
# not touched and no amount changes. Run "อ่านบล็อกค่าโดยสารผู้โดยสารใหม่" for the week first, so the
# discount / insurance / toll lines have their own columns. Count-only unless `to_drive` is ticked.

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "วันแรกของสัปดาห์ (จันทร์) — หลายสัปดาห์ในไฟล์เดียว: คั่นด้วยจุลภาค เช่น 2026-08-17,2026-08-24"
        type: string
        default: "2026-08-24"
      date_to:
        description: "วันสุดท้ายของสัปดาห์ (เรียงคู่กับช่องบน) เช่น 2026-08-23,2026-08-30"
        type: string
        default: "2026-08-30"
      folder:
        description: "วางไฟล์ในโฟลเดอร์นี้ใต้ Exports (ว่าง = วางข้างไฟล์ประจำสัปดาห์)"
        type: string
        default: ""
      file_name:
        description: "ชื่อไฟล์ (ว่าง = ตั้งจากสัปดาห์)"
        type: string
        default: ""
      to_drive:
        description: "วางไฟล์ลง Drive (ไม่ติ๊ก = นับอย่างเดียว)"
        type: boolean
        default: false
      drop_repeats:
        description: "ฉบับคลีน: รหัสการจองเดียวกันเก็บใบที่อ่านก่อน ตัดที่เหลือ (ไฟล์แยกชื่อ '(คลีน)' ไม่แตะฐานข้อมูล)"
        type: boolean
        default: false

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  week:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Write the week in the Phase 3 layout
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          TZ: Asia/Bangkok
          DFROM: ${{ inputs.date_from }}
          DTO: ${{ inputs.date_to }}
          FOLDER: ${{ inputs.folder }}
          FNAME: ${{ inputs.file_name }}
        run: |
          echo "ได้รับ: $DFROM..$DTO to_drive='${{ inputs.to_drive }}'"
          set -- --from "$DFROM" --to "$DTO" --folder "$FOLDER" --name "$FNAME"
          if [ "${{ inputs.to_drive }}" = "true" ]; then set -- "$@" --to-drive; fi
          if [ "${{ inputs.drop_repeats }}" = "true" ]; then set -- "$@" --drop-repeats; fi
          python -u week_phase3.py "$@"
