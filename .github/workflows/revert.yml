name: Revert — คืนอัลบั้มกลับเป็นรูปครึ่งเดิม (เอาไปเทรน)

# Report-only unless `apply` is ticked, and the rows are a second switch again.
#
# Ploy145 paired 139 trips and only 26 of them were adjacent; the rest reached 2 to 79 pictures
# across the album for a partner with a matching fare. Two halves opened side by side were taken
# fourteen minutes apart with the battery five points higher on the lower one — the figures
# agreed because it was a promotion where Grab took nothing, and ฿24 with a zero cut is not rare
# in an album of 145. The albums of Nui and Parichart paired every trip adjacent, so the matcher
# is fine; those two albums are not.
#
# Nothing is deleted on Drive: the originals are still in Pool/_ใช้แล้ว/ and go back where they
# came from; the joined pictures move to Week/_ดึงกลับ/.
#
# The rows are different. A batch result sets status='done' when it lands without asking whether
# anybody parked the row while it was away, so a row left behind comes back to life next round
# attached to a picture that is no longer there. Removing them needs `delete_rows`.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "ชื่อโฟลเดอร์สัปดาห์ใน Inbox"
        type: string
        required: true
        default: "Week 31 Aug-6 Sep"
      albums:
        description: "ชื่ออัลบั้ม คั่นด้วย | (เช่น 2W-Win Ploy145|2W-Win Ploy182)"
        type: string
        required: true
        default: "2W-Win Ploy145|2W-Win Ploy182"
      apply:
        description: "ย้ายไฟล์จริงบน Drive"
        type: boolean
        default: false
      delete_rows:
        description: "ลบแถวที่สร้างจากรูปที่ต่อแล้วด้วย (ต้องติ๊ก apply ด้วย)"
        type: boolean
        default: false
      only_collided:
        description: "เฉพาะคู่ที่ยอดชนกันจนรูปต่อทับกันหาย (กู้ของที่หายก่อน 2026-09-08) — ไม่ใช่ทั้งอัลบั้ม"
        type: boolean
        default: false

# One group for everything that writes to Drive. Each of these used to hold a group of
# its own name, which stops a second copy of itself and nothing else — so a quota apply
# and an ingest round could move the same files and rewrite the same customer images at
# the same time, and nothing anywhere would have noticed. Sharing the group makes them
# queue instead. Runs are free on a public repository, so waiting costs nothing.
concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  revert:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Put the album back the way it arrived
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          TZ: Asia/Bangkok
        run: |
          ARGS="--week '${{ github.event.inputs.week }}'"
          IFS='|' read -ra ALBUMS <<< "${{ github.event.inputs.albums }}"
          for alb in "${ALBUMS[@]}"; do ARGS="$ARGS --album '$alb'"; done
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          if [ "${{ github.event.inputs.delete_rows }}" = "true" ]; then ARGS="$ARGS --delete-rows"; fi
          if [ "${{ github.event.inputs.only_collided }}" = "true" ]; then ARGS="$ARGS --only-collided"; fi
          eval python revert_album.py $ARGS
