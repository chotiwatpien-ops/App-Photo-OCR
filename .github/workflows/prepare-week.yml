name: Prepare week — สร้างโฟลเดอร์สัปดาห์ใหม่ใน Inbox

# Makes Inbox/Week D-D Mon/ with Pool/2W, Pool/4W and the three vehicle groups before the
# week's work arrives. Rider folders are opened by the pool as it files pairs. Safe to press
# twice: folders Ops already made are used as they are, however spelled, and nothing is
# renamed, moved or deleted.

on:
  workflow_dispatch:
    inputs:
      week_from:
        description: "วันจันทร์ของสัปดาห์ เช่น 2026-11-09"
        type: string
        required: true
        default: "2026-11-09"

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Make the week's folders
        working-directory: backend
        env:
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          DRIVE_EXPORTS_FOLDER_ID: ${{ secrets.DRIVE_EXPORTS_FOLDER_ID }}
          TZ: Asia/Bangkok
          WFROM: ${{ inputs.week_from }}
        run: python -u prepare_week.py --from "$WFROM"
