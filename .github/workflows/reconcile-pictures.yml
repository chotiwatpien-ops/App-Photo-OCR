name: Reconcile pictures — จัดรูปรวมร่างให้อยู่โฟลเดอร์ของ job ที่ถือแถว

# After the rehome and the carry, a row's stitched picture can still sit in the folder of the
# job it left: those tools looked in the old job's folder by drive_folder_id, and on 2026-09-10
# that found 44 of 601 — rider folders hold pictures under the names Ops uploaded, many older
# jobs carry no folder id, and the '_0+0_' names from the overwrite bug are shared. Excel and
# Export Pic follow the row and were right; the working folders Ops read were not. This indexes
# every picture in the week's rider folders once and moves each one to its row's job folder.
# A name found in more than one place is listed and never moved on a guess.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "ชื่อโฟลเดอร์สัปดาห์บน Drive"
        type: string
        required: true
        default: "Week 31 Aug-6 Sep"
      date_from:
        description: "วันแรกของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-08-31"
      date_to:
        description: "วันสุดท้ายของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-09-06"
      apply:
        description: "ย้ายจริง (ไม่ติ๊ก = รายงานอย่างเดียว)"
        type: boolean
        default: false

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: จัดรูปให้ตรง job
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          TZ: Asia/Bangkok
        run: |
          ARGS="--week '${{ github.event.inputs.week }}' --from ${{ github.event.inputs.date_from }} --to ${{ github.event.inputs.date_to }}"
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          eval python reconcile_pictures.py $ARGS
