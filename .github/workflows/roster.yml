name: Roster — นำเข้ารายชื่อไรเดอร์จาก Ops

# Ops keeps a pool of names per wheel count, tagged Win / Home / Taxi. This loads that list into
# the database, and that is all it does.
#
# It used to also build next week's folders. It no longer does: since 2026-09-05 distribute.py
# opens a rider's folder at the moment a paired trip needs one, so a week ends up with exactly the
# folders it has work for. Pre-building would leave empty folders behind and, worse, spend the
# names on them — the allocator would then run out of people who are free that week.
#
# The name list itself is never in this repo. Drop the .xlsx into the Inbox on Drive and run this.

on:
  workflow_dispatch:
    inputs:
      names_file:
        description: "ชื่อไฟล์รายชื่อที่วางไว้ใน Inbox บน Drive"
        type: string
        default: "Name list by Type (Rider Project).xlsx"

# One group for everything that writes to Drive. Each of these used to hold a group of
# its own name, which stops a second copy of itself and nothing else — so a quota apply
# and an ingest round could move the same files and rewrite the same customer images at
# the same time, and nothing anywhere would have noticed. Sharing the group makes them
# queue instead. Runs are free on a public repository, so waiting costs nothing.
concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Import Ops' name list
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          TZ: Asia/Bangkok
        run: python roster.py --import-drive "${{ github.event.inputs.names_file }}"
