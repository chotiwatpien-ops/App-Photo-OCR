name: Tests

# Every push and pull request runs the backend test scripts and builds the web page, so a change
# that breaks either is seen here before a round or Render runs it. Nothing here touches the real
# database, Drive or Gemini: each test works on its own throwaway SQLite.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -y -qq libgl1 libglib2.0-0   # opencv (pulled in by the free OCR) needs them
      - run: pip install -r backend/requirements.txt -r backend/requirements-pairing.txt
      - name: Run the tests
        env:
          TZ: Asia/Bangkok
        run: python backend/run_tests.py --jobs 4

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend
      - name: The page builds
        run: npm run build
        working-directory: frontend
