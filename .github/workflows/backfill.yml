name: Backfill — จัดงานที่ลอยอยู่เข้าโฟลเดอร์ไรเดอร์

# One-off cleanup. Rounds before 2026-09-05 dropped stitched pairs straight into Week/<group>/,
# and ingest only ever reads rider folders — so that work has been sitting there unread. The
# stitched file carries the album it came from in its own name, which is where the driver kind
# comes from; nothing is guessed. A file whose name does not say is reported and left alone.
#
# Defaults to report-only. Tick `move` when the report looks right.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "ชื่อโฟลเดอร์สัปดาห์ เช่น Week 31 Aug-6 Sep"
        type: string
        required: true
      groups:
        description: "กลุ่มรถ คั่นด้วยจุลภาค (ว่าง = ทุกกลุ่มในสัปดาห์นั้น)"
        type: string
        default: "2 W Saver,2 W Standard"
      move:
        description: "ย้ายจริง (ไม่ติ๊ก = รายงานอย่างเดียว ไม่แตะ Drive)"
        type: boolean
        default: false

# One group for everything that writes to Drive. Each of these used to hold a group of
# its own name, which stops a second copy of itself and nothing else — so a quota apply
# and an ingest round could move the same files and rewrite the same customer images at
# the same time, and nothing anywhere would have noticed. Sharing the group makes them
# queue instead. Runs are free on a public repository, so waiting costs nothing.
concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Sort the loose work into rider folders
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          TZ: Asia/Bangkok
        run: |
          ARGS="--week '${{ github.event.inputs.week }}'"
          IFS=',' read -ra GS <<< "${{ github.event.inputs.groups }}"
          for g in "${GS[@]}"; do
            g="$(echo "$g" | sed 's/^ *//;s/ *$//')"
            [ -n "$g" ] && ARGS="$ARGS --group '$g'"
          done
          if [ "${{ github.event.inputs.move }}" = "true" ]; then ARGS="$ARGS --move"; fi
          eval python distribute.py $ARGS
