name: Carry back — ดึงแถวที่ยกไปสัปดาห์หน้ากลับ เมื่อนับตาม Service Type แล้วขาดเป้า

# carry-excess counts a group by its jobs; the customer counts by the Service Type on the row
# (Fiat, 2026-09-16). When the chip audit and the rehome run after a carry, a group can end up
# short by Service Type while its own rows sit in next week's file. This takes back only rows
# carry-excess moved out of this week, of the group's own service, earliest slip first, and puts
# each one back in the job, the rider folder and the day it came from. Then run ingest with
# exports_only for both weeks.

on:
  workflow_dispatch:
    inputs:
      week:
        description: "ชื่อโฟลเดอร์สัปดาห์นี้บน Drive (สัปดาห์ที่ขาด)"
        type: string
        required: true
        default: "Week 7-13 Sep"
      date_from:
        description: "วันแรกของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-09-07"
      date_to:
        description: "วันสุดท้ายของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-09-13"
      groups:
        description: "กลุ่มที่จะดึงกลับ คั่นด้วยจุลภาค เช่น 2 W Saver,4 W Standard — ว่าง = ทุกกลุ่ม"
        type: string
        default: ""
      target:
        description: "งานต่อ Service Type ที่ลูกค้ารับ"
        type: string
        required: true
        default: "1470"
      apply:
        description: "ดึงกลับจริง (ไม่ติ๊ก = รายงานอย่างเดียว)"
        type: boolean
        default: false

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  carry-back:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: ดึงแถวกลับ
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          WEEK: ${{ github.event.inputs.week }}
          PULL_GROUPS: ${{ github.event.inputs.groups }}
          TZ: Asia/Bangkok
        run: |
          ARGS=(--week "$WEEK" --from "${{ github.event.inputs.date_from }}" --to "${{ github.event.inputs.date_to }}" --target "${{ github.event.inputs.target }}")
          IFS=',' read -ra GS <<< "$PULL_GROUPS"
          for g in "${GS[@]}"; do
            g="${g#"${g%%[![:space:]]*}"}"; g="${g%"${g##*[![:space:]]}"}"
            if [ -n "$g" ]; then ARGS+=(--group "$g"); fi
          done
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS+=(--apply); fi
          python carry_back.py "${ARGS[@]}"
