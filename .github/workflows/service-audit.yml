name: Service audit — Saver/Standard ในแถวตรงกับโฟลเดอร์ที่รูปอยู่หรือไม่

# The workbook's Service Type came from the job's group, and a job is one group for the whole
# week — so a rider whose pictures were filed under 2 W Saver by the slip's chip, but whose
# job was opened under 2 W Standard, came out 'Standard Bike' on every row (2026-09-09,
# 37 riders, ~870 rows). Report first; apply rewrites the rows and the job's group to match
# the folder, with a note on every changed row. Then run ingest with xlsx_only.

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "วันแรกของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-08-31"
      date_to:
        description: "วันสุดท้ายของสัปดาห์ (YYYY-MM-DD)"
        type: string
        required: true
        default: "2026-09-06"
      apply:
        description: "แก้จริง (แถว + กลุ่มของ job)"
        type: boolean
        default: false

concurrency:
  group: drive-write
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Audit service tiers against folders
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_OAUTH_TOKEN_JSON: ${{ secrets.DRIVE_OAUTH_TOKEN_JSON }}
          DRIVE_INBOX_FOLDER_ID: ${{ secrets.DRIVE_INBOX_FOLDER_ID }}
          TZ: Asia/Bangkok
        run: |
          ARGS="--from ${{ github.event.inputs.date_from }} --to ${{ github.event.inputs.date_to }}"
          if [ "${{ github.event.inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          python service_audit.py $ARGS
